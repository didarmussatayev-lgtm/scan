<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Сканер Склада</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #1e1e24; color: #fff; margin: 0; padding: 15px; }
        .wrapper { max-width: 420px; margin: 0 auto; background: #2a2a35; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #video-container { width: 100%; height: 260px; background: #000; border-radius: 8px; overflow: hidden; position: relative; margin-top: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .laser { position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: #ff3333; box-shadow: 0 0 8px #ff3333; z-index: 10; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .btn-stop { background: #dc3545; margin-top: 5px; }
        .btn-send { background: #17a2b8; }
        .btn-send:hover { background: #117a8b; }
        .btn-send:disabled { background: #5a6268; cursor: not-allowed; }
        #log-box { text-align: left; background: #111; color: #00ff66; font-family: monospace; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 12px; max-height: 180px; overflow-y: auto; border: 1px solid #333; }
        .err { color: #ff4d4d; }
        .success { color: #00ff66; }
        .counter { background: #28a745; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
        .subcounter { background: #3a3a46; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <h3 style="margin: 0 0 5px 0;">📦 Складской Сканер v3</h3>
    <p style="color: #aaa; font-size: 13px; margin: 0;">Наведите красную линию на штрихкод товара</p>
    
    <div id="video-container">
        <video id="video"></video>
        <div class="laser"></div>
    </div>

    <button class="btn" id="scan-trigger">▶ Включить камеру</button>
    <button class="btn btn-stop" id="stop-trigger" style="display:none;">⏹ Стоп</button>
    <button class="btn btn-send" id="send-trigger">📤 Отправить в базу (0/100)</button>
    
    <div class="counter">
        Отсканировано всего: <span id="count">0</span> ✓
    </div>

    <div class="subcounter">
        Готово к отправке: <span id="batch-count">0</span> / 100
    </div>
    
    <div id="log-box">Система готова к запуску.</div>
</div>

<script>
    // WEBHOOK URL ИЗ N8N
    const N8N_URL = 'https://primary-production-6c79b.up.railway.app/webhook-test/f134cd2e-fd08-45d2-b90d-c97514ad45f7';
    const BATCH_SIZE = 100;

    const logBox = document.getElementById('log-box');
    const scanTrigger = document.getElementById('scan-trigger');
    const stopTrigger = document.getElementById('stop-trigger');
    const sendTrigger = document.getElementById('send-trigger');
    const countDisplay = document.getElementById('count');
    const batchCountDisplay = document.getElementById('batch-count');
    
    let codeReader;
    let isScanning = false;
    let lock = false;
    let scannedCount = 0;
    let decodingSession = null;
    let pendingCodes = [];
    let isSendingBatch = false;

    let candidateCode = null;
    let candidateCount = 0;
    const REQUIRED_CONFIRMATIONS = 3;

    function printLog(text, isErr = false, isSuccess = false) {
        const time = new Date().toLocaleTimeString();
        let className = '';
        if (isErr) className = 'err';
        else if (isSuccess) className = 'success';
        
        const msg = `<span class="${className}">[${time}] ${text}</span>`;
        logBox.innerHTML += msg + '<br>';
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateBatchUi() {
        batchCountDisplay.innerText = pendingCodes.length;
        sendTrigger.innerText = `📤 Отправить в базу (${pendingCodes.length}/${BATCH_SIZE})`;
        sendTrigger.disabled = pendingCodes.length === 0 || isSendingBatch;
    }

    function playSuccessSound() {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                return;
            }

            const audioContext = new AudioContextClass();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(1174, audioContext.currentTime + 0.08);

            gainNode.gain.setValueAtTime(0.001, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.22);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.22);

            oscillator.onended = () => {
                if (audioContext.state !== 'closed') {
                    audioContext.close();
                }
            };
        } catch (err) {
            printLog(`⚠ Не удалось воспроизвести звук: ${err.message}`, true);
        }
    }

    function isDigitsOnly(value) {
        return /^\d+$/.test(value);
    }

    function isValidEAN13(code) {
        if (!isDigitsOnly(code) || code.length !== 13) {
            return false;
        }

        const digits = code.split('').map(Number);
        const checkDigit = digits[12];
        let sum = 0;

        for (let i = 0; i < 12; i++) {
            sum += digits[i] * (i % 2 === 0 ? 1 : 3);
        }

        const calculatedCheckDigit = (10 - (sum % 10)) % 10;
        return calculatedCheckDigit === checkDigit;
    }

    function resetCandidate() {
        candidateCode = null;
        candidateCount = 0;
    }

    function processDetectedBarcode(rawCode) {
        const barcode = String(rawCode || '').trim();

        if (!isDigitsOnly(barcode)) {
            return;
        }

        if (barcode.length !== 13) {
            printLog(`⚠ Игнор: ${barcode} — не 13 цифр`, true);
            resetCandidate();
            return;
        }

        if (!isValidEAN13(barcode)) {
            printLog(`⚠ Игнор: ${barcode} — неверная контрольная цифра`, true);
            resetCandidate();
            return;
        }

        if (candidateCode === barcode) {
            candidateCount++;
        } else {
            candidateCode = barcode;
            candidateCount = 1;
        }

        printLog(`🔎 Проверка: ${barcode} (${candidateCount}/${REQUIRED_CONFIRMATIONS})`);

        if (candidateCount < REQUIRED_CONFIRMATIONS) {
            return;
        }

        lock = true;
        resetCandidate();

        scannedCount++;
        pendingCodes.push(barcode);
        countDisplay.innerText = scannedCount;
        updateBatchUi();

        printLog(`✓ Код подтверждён: ${barcode}`, false, true);
        printLog(`📦 Добавлен в очередь отправки: ${pendingCodes.length}/${BATCH_SIZE}`);

        playSuccessSound();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100]);
        }

        if (pendingCodes.length >= BATCH_SIZE) {
            sendBatchToN8n();
            return;
        }

        setTimeout(() => {
            lock = false;
            printLog('Готов к следующему коду.');
        }, 700);
    }

    function sendBatchToN8n() {
        if (isSendingBatch) {
            printLog('⏳ Отправка уже выполняется, дождитесь завершения.', true);
            return;
        }

        if (pendingCodes.length === 0) {
            printLog('⚠ Нет товаров для отправки в базу.', true);
            return;
        }

        const codesToSend = [...pendingCodes];
        isSendingBatch = true;
        lock = true;
        updateBatchUi();

        printLog(`📤 Отправка ${codesToSend.length} товаров в базу данных...`);

        fetch(N8N_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                total: codesToSend.length,
                barcodes: codesToSend,
                sentAt: new Date().toISOString()
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.text();
        })
        .then(data => {
            printLog(`✓ База получила ${codesToSend.length} товаров`, false, true);
            if (data) {
                printLog(`Ответ сервера: ${data.substring(0, 80)}`);
            }
            pendingCodes = [];
            updateBatchUi();
        })
        .catch(err => {
            printLog(`❌ Ошибка отправки в базу: ${err.message}`, true);
        })
        .finally(() => {
            isSendingBatch = false;
            lock = false;
            updateBatchUi();
            printLog('Готов к следующему коду.');
        });
    }

    // Кнопка "Включить камеру"
    scanTrigger.addEventListener('click', async () => {
        if (isScanning) return;
        
        try {
            isScanning = true;
            scanTrigger.style.display = 'none';
            stopTrigger.style.display = 'block';
            printLog('📷 Инициализация камеры и ZXing...', false, false);

            codeReader = new ZXing.BrowserMultiFormatReader();
            
            decodingSession = await codeReader.decodeFromVideoDevice(undefined, 'video', (result, error) => {
                if (result && !lock) {
                    processDetectedBarcode(result.text);
                }
            });
            
            printLog('✓ Камера работает. Сканируйте штрихкоды.', false, true);

        } catch (err) {
            isScanning = false;
            scanTrigger.style.display = 'block';
            stopTrigger.style.display = 'none';
            printLog(`❌ Ошибка камеры: ${err.message}`, true);
        }
    });

    // Кнопка "Стоп"
    stopTrigger.addEventListener('click', () => {
        if (codeReader) {
            codeReader.reset();
        }
        isScanning = false;
        resetCandidate();
        scanTrigger.style.display = 'block';
        stopTrigger.style.display = 'none';
        printLog('⏹ Сканирование остановлено.');
    });

    sendTrigger.addEventListener('click', () => {
        sendBatchToN8n();
    });

    updateBatchUi();

    // При закрытии страницы
    window.addEventListener('beforeunload', () => {
        if (codeReader) {
            codeReader.reset();
        }
    });
</script>

</body>
</html>
