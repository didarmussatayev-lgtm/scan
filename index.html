<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Сканер Склада</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #1e1e24; color: #fff; margin: 0; padding: 15px; }
        .wrapper { max-width: 420px; margin: 0 auto; background: #2a2a35; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #video-container { width: 100%; height: 260px; background: #000; border-radius: 8px; overflow: hidden; position: relative; margin-top: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .laser { position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: #ff3333; box-shadow: 0 0 8px #ff3333; z-index: 10; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .btn-stop { background: #dc3545; margin-top: 5px; }
        #log-box { text-align: left; background: #111; color: #00ff66; font-family: monospace; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 12px; max-height: 180px; overflow-y: auto; border: 1px solid #333; }
        .err { color: #ff4d4d; }
        .success { color: #00ff66; }
        .counter { background: #28a745; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <h3 style="margin: 0 0 5px 0;">📦 Складской Сканер v3</h3>
    <p style="color: #aaa; font-size: 13px; margin: 0;">Наведите красную линию на штрихкод товара</p>
    
    <div id="video-container">
        <video id="video"></video>
        <div class="laser"></div>
    </div>

    <button class="btn" id="scan-trigger">▶ Включить камеру</button>
    <button class="btn btn-stop" id="stop-trigger" style="display:none;">⏹ Стоп</button>
    
    <div class="counter">
        Отсканировано: <span id="count">0</span> ✓
    </div>
    
    <div id="log-box">Система готова к запуску.</div>
</div>

<script>
    // WEBHOOK URL ИЗ N8N
    const N8N_URL = 'https://primary-production-6c79b.up.railway.app/webhook-test/f134cd2e-fd08-45d2-b90d-c97514ad45f7';

    const logBox = document.getElementById('log-box');
    const scanTrigger = document.getElementById('scan-trigger');
    const stopTrigger = document.getElementById('stop-trigger');
    const countDisplay = document.getElementById('count');
    const videoElement = document.getElementById('video');
    const REQUIRED_CONFIRMATIONS = 3;
    const EAN_13_REGEX = /^\d{13}$/;
    
    let codeReader;
    let isScanning = false;
    let lock = false;
    let scannedCount = 0;
    let decodingSession = null;
    let pendingBarcode = '';
    let confirmationCount = 0;
    let audioContext = null;

    function printLog(text, isErr = false, isSuccess = false) {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        if (isErr) line.className = 'err';
        else if (isSuccess) line.className = 'success';
        line.textContent = `[${time}] ${text}`;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function resetConfirmationState() {
        pendingBarcode = '';
        confirmationCount = 0;
    }

    function isIPhoneSafari() {
        const ua = navigator.userAgent || '';
        const isAppleMobile = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome/i.test(ua);
        return isAppleMobile && isSafari;
    }

    function createScannerHints() {
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]);
        return hints;
    }

    function createVideoConstraints() {
        const constraints = {
            video: {
                facingMode: { ideal: 'environment' }
            },
            audio: false
        };

        if (isIPhoneSafari()) {
            constraints.video.advanced = [{ focusMode: 'manual' }];
        }

        return constraints;
    }

    async function disableContinuousAutofocusIfPossible() {
        if (!isIPhoneSafari() || !videoElement.srcObject) return;

        const [track] = videoElement.srcObject.getVideoTracks();
        if (!track || typeof track.getCapabilities !== 'function' || typeof track.applyConstraints !== 'function') return;

        try {
            const capabilities = track.getCapabilities();
            if (Array.isArray(capabilities.focusMode)) {
                if (capabilities.focusMode.includes('manual')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
                } else if (capabilities.focusMode.includes('single-shot')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                }
            }
        } catch (err) {
            printLog(`ℹ️ Не удалось изменить автофокус: ${err.message}`);
        }
    }

    function isValidEan13Checksum(barcode) {
        const digits = barcode.split('').map(Number);
        const evenSum = digits.slice(0, 12).reduce((sum, digit, index) => sum + ((index + 1) % 2 === 0 ? digit : 0), 0);
        const oddSum = digits.slice(0, 12).reduce((sum, digit, index) => sum + ((index + 1) % 2 !== 0 ? digit : 0), 0);
        const total = oddSum + (evenSum * 3);
        const remainder = total % 10;
        const controlDigit = remainder === 0 ? 0 : 10 - remainder;
        return digits[12] === controlDigit;
    }

    function processDetectedBarcode(result) {
        if (lock || !result) return;

        const format = typeof result.getBarcodeFormat === 'function' ? result.getBarcodeFormat() : result.barcodeFormat;
        const barcode = (result.text || '').trim();

        if (format !== ZXing.BarcodeFormat.EAN_13 || !EAN_13_REGEX.test(barcode)) {
            resetConfirmationState();
            printLog('❌ Неверный формат: нужен EAN-13 из 13 цифр.', true);
            return;
        }

        if (!isValidEan13Checksum(barcode)) {
            resetConfirmationState();
            printLog(`❌ Неверная контрольная сумма EAN-13: ${barcode}.`, true);
            return;
        }

        confirmationCount = barcode === pendingBarcode ? confirmationCount + 1 : 1;
        pendingBarcode = barcode;
        printLog(`📶 Подтверждение сканирования: ${confirmationCount}/${REQUIRED_CONFIRMATIONS} для ${barcode}.`);

        if (confirmationCount < REQUIRED_CONFIRMATIONS) return;

        lock = true;
        resetConfirmationState();
        scannedCount++;
        countDisplay.innerText = scannedCount;
        printLog(`✅ Код подтвержден ${REQUIRED_CONFIRMATIONS}/${REQUIRED_CONFIRMATIONS}: ${barcode}. Отправляем в N8N...`, false, true);
        playSuccessSound();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        sendDataToN8n(barcode);
    }

    function playSuccessSound() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!audioContext) {
            audioContext = new AudioCtx();
        }

        if (audioContext.state === 'suspended') {
            audioContext.resume().catch(() => {});
        }

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gainNode.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.18, audioContext.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.18);
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.18);
    }

    // Кнопка "Включить камеру"
    scanTrigger.addEventListener('click', async () => {
        if (isScanning) return;
        
        try {
            resetConfirmationState();
            lock = false;
            isScanning = true;
            scanTrigger.style.display = 'none';
            stopTrigger.style.display = 'block';
            printLog('📷 Инициализация камеры и ZXing...', false, false);

            codeReader = new ZXing.BrowserMultiFormatReader(createScannerHints());
            
            // Запуск декодирования
            decodingSession = await codeReader.decodeFromConstraints(createVideoConstraints(), 'video', (result, error) => {
                if (result) {
                    processDetectedBarcode(result);
                } else if (error && !(error instanceof ZXing.NotFoundException)) {
                    printLog(`❌ Ошибка сканирования: ${error.message}`, true);
                }
            });
            await disableContinuousAutofocusIfPossible();
            
            printLog('✓ Камера работает. Сканируйте EAN-13.', false, true);

        } catch (err) {
            resetConfirmationState();
            lock = false;
            isScanning = false;
            scanTrigger.style.display = 'block';
            stopTrigger.style.display = 'none';
            printLog(`❌ Ошибка камеры: ${err.message}`, true);
        }
    });

    // Кнопка "Стоп"
    stopTrigger.addEventListener('click', () => {
        if (codeReader) {
            codeReader.reset();
        }
        resetConfirmationState();
        lock = false;
        decodingSession = null;
        isScanning = false;
        scanTrigger.style.display = 'block';
        stopTrigger.style.display = 'none';
        printLog('⏹ Сканирование остановлено.');
    });

    // Отправка в N8N через GET параметр
    function sendDataToN8n(code) {
        // Правильный способ: GET запрос с параметром в URL
        const webhookUrl = N8N_URL + '?barcode=' + encodeURIComponent(code);
        
        printLog(`📤 Отправка подтвержденного кода ${code} в N8N...`);

        return fetch(webhookUrl, {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            // Проверяем статус ответа
            if (response.ok) {
                printLog(`✅ Код ${code} принят и отправлен в N8N.`, false, true);
            } else {
                printLog(`⚠ N8N ответил со статусом ${response.status}`, true);
            }
            return response.text();
        })
        .then(data => {
            if (data) {
                printLog(`N8N ответ: ${data.substring(0, 50)}`);
            }
        })
        .catch(err => {
            printLog(`❌ Ошибка отправки: ${err.message}`, true);
        })
        .finally(() => {
            resetConfirmationState();
            // Через 2 секунды разблокируем сканирование
            setTimeout(() => { 
                lock = false;
                printLog('Готов к следующему EAN-13.');
            }, 2000);
        });
    }

    // При закрытии страницы
    window.addEventListener('beforeunload', () => {
        if (codeReader) {
            codeReader.reset();
        }
    });
</script>

</body>
</html>
