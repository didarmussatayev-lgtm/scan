<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Сканер Склада</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #1e1e24; color: #fff; margin: 0; padding: 15px; }
        .wrapper { max-width: 420px; margin: 0 auto; background: #2a2a35; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #video-container { width: 100%; height: 260px; background: #000; border-radius: 8px; overflow: hidden; position: relative; margin-top: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .laser { position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: #ff3333; box-shadow: 0 0 8px #ff3333; z-index: 10; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .btn-stop { background: #dc3545; margin-top: 5px; }
        .btn-send { background: #17a2b8; }
        .btn-send:hover { background: #117a8b; }
        .btn-send:disabled { background: #5a6268; cursor: not-allowed; }
        .manual-panel { text-align: left; background: #1f1f28; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .manual-title { margin: 0 0 10px 0; font-size: 14px; color: #ddd; font-weight: bold; }
        .manual-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 8px; }
        .input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 6px; border: 1px solid #4b4b5a; background: #111; color: #fff; font-size: 15px; }
        .input:focus { outline: none; border-color: #17a2b8; }
        .btn-add { background: #28a745; }
        .btn-add:hover { background: #1e7e34; }
        #pending-list { text-align: left; background: #111; color: #fff; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 12px; max-height: 180px; overflow-y: auto; }
        .pending-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #2b2b36; }
        .pending-item:last-child { border-bottom: none; }
        .pending-code { color: #9ad1ff; word-break: break-all; }
        .pending-qty { color: #ffd166; white-space: nowrap; }
        #log-box { text-align: left; background: #111; color: #00ff66; font-family: monospace; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 12px; max-height: 180px; overflow-y: auto; }
        .err { color: #ff4d4d; }
        .success { color: #00ff66; }
        .counter { background: #28a745; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
        .subcounter { background: #3a3a46; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <h3 style="margin: 0 0 5px 0;">📦 Складской Сканер v4</h3>
    <p style="color: #aaa; font-size: 13px; margin: 0;">Сканируйте один раз или вводите штрихкод и количество вручную</p>
    
    <div id="video-container">
        <video id="video"></video>
        <div class="laser"></div>
    </div>

    <button class="btn" id="scan-trigger">▶ Включить камеру</button>
    <button class="btn btn-stop" id="stop-trigger" style="display:none;">⏹ Стоп</button>

    <div class="manual-panel">
        <div class="manual-title">Добавить товар по одному скану или вручную</div>
        <div class="manual-grid">
            <input class="input" id="barcode-input" type="text" inputmode="numeric" placeholder="Штрихкод (13 цифр)" maxlength="13">
            <input class="input" id="quantity-input" type="number" inputmode="numeric" placeholder="Кол-во" min="1" step="1" value="1">
        </div>
        <button class="btn btn-add" id="add-trigger">➕ Добавить в очередь</button>
    </div>

    <button class="btn btn-send" id="send-trigger">📤 Отправить в базу (0 шт)</button>
    
    <div class="counter">
        Всего товаров в ��череди: <span id="count">0</span> шт
    </div>

    <div class="subcounter">
        Уникальных штрихкодов: <span id="batch-count">0</span>
    </div>

    <div id="pending-list">Очередь пуста.</div>
    <div id="log-box">Система готова к запуску.</div>
</div>

<script>
    const N8N_URL = 'https://primary-production-2ac14.up.railway.app/webhook/c4cab906-47d7-45a3-aba1-60d6bccf399e';

    const logBox = document.getElementById('log-box');
    const scanTrigger = document.getElementById('scan-trigger');
    const stopTrigger = document.getElementById('stop-trigger');
    const sendTrigger = document.getElementById('send-trigger');
    const addTrigger = document.getElementById('add-trigger');
    const countDisplay = document.getElementById('count');
    const batchCountDisplay = document.getElementById('batch-count');
    const barcodeInput = document.getElementById('barcode-input');
    const quantityInput = document.getElementById('quantity-input');
    const pendingList = document.getElementById('pending-list');
    
    let codeReader;
    let isScanning = false;
    let lock = false;
    let decodingSession = null;
    let pendingItems = [];
    let isSendingBatch = false;

    let candidateCode = null;
    let candidateCount = 0;
    const REQUIRED_CONFIRMATIONS = 1;

    function printLog(text, isErr = false, isSuccess = false) {
        const time = new Date().toLocaleTimeString();
        let className = '';
        if (isErr) className = 'err';
        else if (isSuccess) className = 'success';
        
        const msg = `<span class="${className}">[${time}] ${text}</span>`;
        logBox.innerHTML += msg + '<br>';
        logBox.scrollTop = logBox.scrollHeight;
    }

    function getTotalQuantity() {
        return pendingItems.reduce((sum, item) => sum + item.quantity, 0);
    }

    function renderPendingList() {
        if (pendingItems.length === 0) {
            pendingList.innerHTML = 'Очередь пуста.';
            return;
        }

        pendingList.innerHTML = pendingItems
            .map(item => `
                <div class="pending-item">
                    <span class="pending-code">${item.barcode}</span>
                    <span class="pending-qty">${item.quantity} шт</span>
                </div>
            `)
            .join('');
    }

    function updateBatchUi() {
        const totalQuantity = getTotalQuantity();
        countDisplay.innerText = totalQuantity;
        batchCountDisplay.innerText = pendingItems.length;
        sendTrigger.innerText = `📤 Отправить в базу (${totalQuantity} шт)`;
        sendTrigger.disabled = pendingItems.length === 0 || isSendingBatch;
        renderPendingList();
    }

    function playSuccessSound() {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                return;
            }

            const audioContext = new AudioContextClass();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(1174, audioContext.currentTime + 0.08);

            gainNode.gain.setValueAtTime(0.001, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.22);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.22);

            oscillator.onended = () => {
                if (audioContext.state !== 'closed') {
                    audioContext.close();
                }
            };
        } catch (err) {
            printLog(`⚠ Не удалось воспроизвести звук: ${err.message}`, true);
        }
    }

    function isDigitsOnly(value) {
        return /^\d+$/.test(value);
    }

    function isValidEAN13(code) {
        if (!isDigitsOnly(code) || code.length !== 13) {
            return false;
        }

        const digits = code.split('').map(Number);
        const checkDigit = digits[12];
        let sum = 0;

        for (let i = 0; i < 12; i++) {
            sum += digits[i] * (i % 2 === 0 ? 1 : 3);
        }

        const calculatedCheckDigit = (10 - (sum % 10)) % 10;
        return calculatedCheckDigit === checkDigit;
    }

    function resetCandidate() {
        candidateCode = null;
        candidateCount = 0;
    }

    function addItemToQueue(barcode, quantity) {
        const normalizedBarcode = String(barcode || '').trim();
        const parsedQuantity = Number(quantity);

        if (!isDigitsOnly(normalizedBarcode) || normalizedBarcode.length !== 13) {
            printLog(`⚠ Игнор: ${normalizedBarcode || 'пусто'} — штрихкод должен быть 13 цифр`, true);
            return false;
        }

        if (!isValidEAN13(normalizedBarcode)) {
            printLog(`⚠ Игнор: ${normalizedBarcode} — неверная контрольная цифра`, true);
            return false;
        }

        if (!Number.isInteger(parsedQuantity) || parsedQuantity < 1) {
            printLog('⚠ Количество должно быть целым числом больше 0', true);
            return false;
        }

        const existingItem = pendingItems.find(item => item.barcode === normalizedBarcode);
        if (existingItem) {
            existingItem.quantity += parsedQuantity;
        } else {
            pendingItems.push({ barcode: normalizedBarcode, quantity: parsedQuantity });
        }

        updateBatchUi();
        printLog(`✓ Добавлено: ${normalizedBarcode} × ${parsedQuantity}`, false, true);
        playSuccessSound();

        if (navigator.vibrate) {
            navigator.vibrate(80);
        }

        return true;
    }

    function processDetectedBarcode(rawCode) {
        const barcode = String(rawCode || '').trim();

        if (!isDigitsOnly(barcode)) {
            return;
        }

        if (!isValidEAN13(barcode)) {
            printLog(`⚠ Игнор: ${barcode} — неверный EAN-13`, true);
            resetCandidate();
            return;
        }

        if (candidateCode === barcode) {
            candidateCount++;
        } else {
            candidateCode = barcode;
            candidateCount = 1;
        }

        printLog(`🔎 Код найден: ${barcode} (${candidateCount}/${REQUIRED_CONFIRMATIONS})`);

        if (candidateCount < REQUIRED_CONFIRMATIONS) {
            return;
        }

        lock = true;
        resetCandidate();
        barcodeInput.value = barcode;
        quantityInput.value = quantityInput.value && Number(quantityInput.value) > 0 ? quantityInput.value : 1;

        const added = addItemToQueue(barcode, Number(quantityInput.value || 1));
        if (!added) {
            lock = false;
            return;
        }

        setTimeout(() => {
            lock = false;
            printLog('Готов к следующему коду.');
        }, 700);
    }

    function sendBatchToN8n() {
        if (isSendingBatch) {
            printLog('⏳ Отправка уже выполняется, дождитесь завершения.', true);
            return;
        }

        if (pendingItems.length === 0) {
            printLog('⚠ Нет товаров для отправки в базу.', true);
            return;
        }

        const itemsToSend = pendingItems.map(item => ({ ...item }));
        const totalQuantity = getTotalQuantity();
        isSendingBatch = true;
        lock = true;
        updateBatchUi();

        printLog(`📤 Отправка ${totalQuantity} шт (${itemsToSend.length} уникальных штрихкодов) в базу данных...`);

        fetch(N8N_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                totalItems: totalQuantity,
                uniqueBarcodes: itemsToSend.length,
                items: itemsToSend,
                sentAt: new Date().toISOString()
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.text();
        })
        .then(data => {
            printLog(`✓ База получила ${totalQuantity} шт`, false, true);
            if (data) {
                printLog(`Ответ сервера: ${data.substring(0, 80)}`);
            }
            pendingItems = [];
            updateBatchUi();
            barcodeInput.value = '';
            quantityInput.value = 1;
        })
        .catch(err => {
            printLog(`❌ Ошибка отправки в базу: ${err.message}`, true);
        })
        .finally(() => {
            isSendingBatch = false;
            lock = false;
            updateBatchUi();
            printLog('Готов к следующему коду.');
        });
    }

    scanTrigger.addEventListener('click', async () => {
        if (isScanning) return;
        
        try {
            isScanning = true;
            scanTrigger.style.display = 'none';
            stopTrigger.style.display = 'block';
            printLog('📷 Инициализация камеры и ZXing...');

            codeReader = new ZXing.BrowserMultiFormatReader();
            
            decodingSession = await codeReader.decodeFromVideoDevice(undefined, 'video', (result, error) => {
                if (result && !lock) {
                    processDetectedBarcode(result.text);
                }
            });
            
            printLog('✓ Камера работает. Сканируйте штрихкоды.', false, true);

        } catch (err) {
            isScanning = false;
            scanTrigger.style.display = 'block';
            stopTrigger.style.display = 'none';
            printLog(`❌ Ошибка камеры: ${err.message}`, true);
        }
    });

    stopTrigger.addEventListener('click', () => {
        if (codeReader) {
            codeReader.reset();
        }
        isScanning = false;
        resetCandidate();
        scanTrigger.style.display = 'block';
        stopTrigger.style.display = 'none';
        printLog('⏹ Сканирование остановлено.');
    });

    addTrigger.addEventListener('click', () => {
        const barcode = barcodeInput.value.trim();
        const quantity = Number(quantityInput.value || 1);
        const added = addItemToQueue(barcode, quantity);

        if (added) {
            barcodeInput.value = '';
            quantityInput.value = 1;
            barcodeInput.focus();
        }
    });

    barcodeInput.addEventListener('input', () => {
        barcodeInput.value = barcodeInput.value.replace(/\D/g, '').slice(0, 13);
    });

    quantityInput.addEventListener('input', () => {
        const cleaned = quantityInput.value.replace(/\D/g, '');
        quantityInput.value = cleaned === '' ? '' : String(Math.max(1, Number(cleaned)));
    });

    sendTrigger.addEventListener('click', () => {
        sendBatchToN8n();
    });

    updateBatchUi();

    window.addEventListener('beforeunload', () => {
        if (codeReader) {
            codeReader.reset();
        }
    });
</script>

</body>
</html>
